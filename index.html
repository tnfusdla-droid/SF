<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentenceFlow</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX & TSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <!-- App.tsx 코드를 손대지 않고 브라우저에서 직접 로드하여 실행 -->
    <script type="text/babel" data-presets="react, typescript" src="./App.tsx"></script>
    <script type="text/babel">
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const target = document.getElementById('root');
                if (target && !target.hasChildNodes() && window.App) {
                    const root = ReactDOM.createRoot(target);
                    root.render(React.createElement(window.App));
                }
            }, 500);
        });
    </script>
</body>
</html>
